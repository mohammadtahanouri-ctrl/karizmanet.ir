<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>کاریزما نت | کافی‌نت آنلاین و خدمات دیجیتال</title>
    <meta name="description" content="کافی‌نت آنلاین کاریزما نت؛ ثبت‌نام سامانه‌های دولتی، پرینت، کپی، اسکن، تایپ و کلیه خدمات اداری به‌صورت غیرحضوری. سریع، مطمئن، در سراسر ایران.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b1120;
            --surface: #1e293b;
            --surface-glass: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #0ea5e9;
            --success: #22c55e;
            --danger: #ef4444;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            
            --screen-bg: #050914;
            --screen-glow: rgba(99, 102, 241, 0.4);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.15);
            --keyboard-bg: rgba(15, 23, 42, 0.6);
            --keyboard-text-color: #38bdf8;
        }
        [data-theme="light"] {
            --bg: #f1f5f9;
            --surface: #ffffff;
            --surface-glass: rgba(255, 255, 255, 0.85);
            --border: rgba(0, 0, 0, 0.08);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            
            --screen-bg: #e2e8f0;
            --screen-glow: rgba(99, 102, 241, 0.2);
            --glass-bg: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(0, 0, 0, 0.1);
            --keyboard-bg: rgba(255, 255, 255, 0.8);
            --keyboard-text-color: #0284c7;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text-main); line-height: 1.7; overflow-x: hidden; transition: background 0.3s, color 0.3s; padding-bottom: 70px; }
        a { color: inherit; text-decoration: none; }

        /* Header & Expanded Search */
        header { position: sticky; top: 0; z-index: 100; background: var(--surface-glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .logo { font-weight: 800; font-size: 20px; background: linear-gradient(90deg, var(--accent), var(--primary)); -webkit-background-clip: text; color: transparent; display: flex; align-items: center; gap: 6px; white-space: nowrap; z-index: 102;}
        .logo i { color: var(--accent); }
        .nav-links { display: none; gap: 16px; font-weight: 700; font-size: 13px; }
        .nav-links a { color: var(--text-muted); transition: color 0.2s; cursor: pointer; }
        .nav-links a:hover { color: var(--primary); }

        .header-actions { display: flex; align-items: center; gap: 8px; flex: 1; justify-content: flex-end; position: relative; }
        
        /* Search Box (Smart Expand) */
        .search-box-mini { position: relative; width: 180px; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 101; }
        .search-box-mini input { width: 100%; padding: 7px 12px 7px 30px; border-radius: 20px; background: var(--surface); border: 1px solid var(--border); color: var(--text-main); font-size: 12px; outline: none; transition: all 0.3s; }
        .search-box-mini input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(99,102,241,0.3); }
        .search-box-mini i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 12px; cursor: pointer; z-index: 2;}
        
        /* Search Expanded State */
        .search-box-mini.expanded { width: 340px; }
        
        /* Search Shake Animation */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        .search-box-mini.shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; border-color: var(--danger); }
        .search-box-mini.shake input { border-color: var(--danger); }

        /* Match Glow Effect */
        @keyframes pulseMatch {
            0% { transform: scale(1); box-shadow: 0 0 0px var(--accent); }
            50% { transform: scale(1.02); box-shadow: 0 0 20px rgba(14, 165, 233, 0.6); }
            100% { transform: scale(1); box-shadow: 0 0 10px rgba(14, 165, 233, 0.2); }
        }
        .search-match {
            border-color: var(--accent) !important;
            animation: pulseMatch 1s ease;
        }

        .btn-icon { background: var(--surface); border: 1px solid var(--border); color: var(--text-main); width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; transition: 0.2s; font-size: 14px; position: relative; flex-shrink: 0; z-index: 102;}
        .btn-icon:hover { background: var(--primary); color: #fff; }
        .cart-badge { position: absolute; top: -4px; right: -4px; background: var(--danger); color: #fff; font-size: 9px; font-weight: bold; width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; display: none; }

        /* --- HERO: 3D Monitor & Glass Keyboard (Compact & Vibrant) --- */
        .hero { padding: 30px 20px 40px; text-align: center; background: radial-gradient(circle at 50% 0%, rgba(99,102,241,0.15), transparent 70%); position: relative; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
        .hero-badge { display: inline-block; padding: 6px 16px; border-radius: 30px; background: rgba(99,102,241,0.1); border: 1px solid rgba(99,102,241,0.3); color: var(--primary); font-size: 13px; font-weight: 700; margin-bottom: 20px; backdrop-filter: blur(10px); animation: fadeInDown 0.8s ease-out; }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        .monitor-wrapper { position: relative; width: 100%; max-width: 800px; perspective: 1200px; }
        .monitor { position: relative; width: 95%; margin: 0 auto; aspect-ratio: 16/8; background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02)); border: 2px solid var(--glass-border); border-radius: 20px; box-shadow: 0 0 40px var(--screen-glow), inset 0 0 20px rgba(0,0,0,0.5); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; padding: 20px; transform: rotateX(5deg); transition: transform 0.5s; }
        .monitor::before { content: ''; position: absolute; inset: 8px; border-radius: 14px; background: var(--screen-bg); z-index: 1; }
        .monitor-content { position: relative; z-index: 2; text-align: center; }
        .monitor h1 { font-size: clamp(20px, 4vw, 34px); font-weight: 800; line-height: 1.4; color: var(--text-main); text-shadow: 0 0 15px var(--primary), 0 0 30px var(--accent); margin-bottom: 0; }
        .monitor h1 span { color: var(--accent); }
        
        .monitor-neck { width: 60px; height: 25px; background: linear-gradient(to bottom, var(--glass-border), transparent); margin: 0 auto; clip-path: polygon(20% 0, 80% 0, 100% 100%, 0% 100%); }
        .monitor-base { width: 180px; height: 10px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 10px; margin: 0 auto; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }

        .keyboard { position: relative; width: 90%; max-width: 700px; margin: -5px auto 0; background: var(--keyboard-bg); border: 1px solid var(--glass-border); border-radius: 12px; padding: 20px 15px; transform: rotateX(35deg) translateY(-10px); transform-origin: top center; box-shadow: 0 25px 40px rgba(0,0,0,0.5), inset 0 0 30px rgba(255,255,255,0.05); backdrop-filter: blur(20px); transition: transform 0.5s; }
        .keyboard::before { content: ''; position: absolute; inset: 5px; border-radius: 8px; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 20px 20px; z-index: 0; }
        .keyboard-text { position: relative; z-index: 2; color: var(--keyboard-text-color); font-weight: 800; font-size: clamp(13px, 2vw, 16px); line-height: 1.6; text-align: center; text-shadow: 0 0 10px rgba(56, 189, 248, 0.6), 0 2px 4px rgba(0,0,0,0.8); }

        /* Sections */
        section { max-width: 1100px; margin: 0 auto; padding: 25px 16px; }
        .section-title { font-size: 22px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .section-title i { color: var(--primary); }

        /* Tabs */
        .tabs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab { padding: 8px 16px; border-radius: 20px; background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); font-size: 13px; font-weight: 700; white-space: nowrap; cursor: pointer; transition: 0.2s; }
        .tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        /* Services Grid */
        .services-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .svc-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; transition: 0.3s; position: relative; display: flex; flex-direction: column; gap: 12px; }
        .svc-card:hover { border-color: var(--primary); box-shadow: 0 10px 25px rgba(99,102,241,0.15); transform: translateY(-3px); }
        .svc-title { font-weight: 700; font-size: 15px; line-height: 1.5; min-height: 45px; }
        .svc-prices { display: flex; align-items: center; gap: 10px; margin-top: auto; }
        .svc-old { color: var(--text-muted); text-decoration: line-through; font-size: 13px; }
        .svc-new { color: var(--success); font-weight: 800; font-size: 16px; }
        .svc-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; border-top: 1px solid var(--border); padding-top: 12px; }
        .qty-control { display: flex; align-items: center; background: var(--bg); border: 1px solid var(--border); border-radius: 20px; padding: 2px; }
        .qty-control button { width: 28px; height: 28px; border: none; background: transparent; color: var(--text-main); cursor: pointer; font-size: 16px; border-radius: 50%; transition: 0.2s; }
        .qty-control button:hover { background: var(--primary); color: #fff; }
        .qty-control span { width: 30px; text-align: center; font-weight: 700; font-size: 14px; }
        .btn-add { background: var(--primary); color: #fff; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 700; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px; font-size: 13px; }
        .btn-add:hover { background: var(--primary-hover); }
        .btn-add.added { background: var(--success); }

        /* Links Grid */
        .links-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .link-card { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); transition: 0.2s; font-size: 13px; font-weight: 700; }
        .link-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 15px rgba(14, 165, 233, 0.15); }
        .link-card .emoji { font-size: 20px; }

        /* Upload & Contact Cards */
        .action-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 30px 20px; text-align: center; transition: 0.3s; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
        .action-card:hover { border-color: var(--primary); background: rgba(99,102,241,0.05); transform: translateY(-3px); }
        .action-card i { font-size: 40px; color: var(--primary); }
        .action-card h3 { font-size: 16px; }
        .action-card p { color: var(--text-muted); font-size: 13px; }

        /* FAQ */
        .faq-item { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
        .faq-q { padding: 16px; font-weight: 700; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .faq-a { padding: 0 16px; max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; color: var(--text-muted); font-size: 14px; }
        .faq-item.active .faq-a { max-height: 200px; padding-bottom: 16px; }
        .faq-item.active .faq-q i { transform: rotate(180deg); }

        /* Cart Drawer */
        .cart-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 1000; opacity: 0; visibility: hidden; transition: 0.3s; }
        .cart-overlay.open { opacity: 1; visibility: visible; }
        .cart-drawer { position: fixed; top: 0; left: -100%; width: 100%; max-width: 400px; height: 100%; background: var(--bg); z-index: 1001; box-shadow: 5px 0 30px rgba(0,0,0,0.5); transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; }
        .cart-drawer.open { left: 0; }
        .cart-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .cart-header h2 { font-size: 18px; display: flex; align-items: center; gap: 8px; }
        .cart-items { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; background: var(--surface); padding: 12px; border-radius: 12px; border: 1px solid var(--border); }
        .cart-item-info h4 { font-size: 14px; margin-bottom: 4px; }
        .cart-item-info span { font-size: 13px; color: var(--success); font-weight: 700; }
        .cart-footer { padding: 20px; border-top: 1px solid var(--border); background: var(--surface); }
        .cart-total { display: flex; justify-content: space-between; font-size: 18px; font-weight: 800; margin-bottom: 15px; }
        .btn-checkout { width: 100%; padding: 14px; border-radius: 12px; background: linear-gradient(90deg, var(--primary), var(--accent)); color: #fff; border: none; font-weight: 800; font-size: 16px; cursor: pointer; transition: 0.3s; }
        .btn-checkout:hover { opacity: 0.9; transform: scale(1.02); }
        .empty-cart { text-align: center; color: var(--text-muted); margin-top: 50px; }
        .empty-cart i { font-size: 50px; margin-bottom: 15px; opacity: 0.5; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface-glass); backdrop-filter: blur(16px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 0; z-index: 99; }
        .bn-item { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--text-muted); font-size: 10px; font-weight: 700; transition: 0.2s; }
        .bn-item i { font-size: 18px; }
        .bn-item.active { color: var(--primary); }

        /* Modals (Checkout, Contact, Upload) */
        dialog { width: 90%; max-width: 500px; margin: auto; background: var(--bg); color: var(--text-main); border: 1px solid var(--border); border-radius: 20px; padding: 24px; box-shadow: var(--shadow); }
        dialog::backdrop { background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 700; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text-main); font-family: inherit; font-size: 14px; outline: none; }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--primary); }

        /* Contact Modal Specific */
        .contact-grid { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .contact-item { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--surface); border-radius: 12px; border: 1px solid var(--border); }
        .contact-item i { font-size: 20px; color: var(--accent); width: 24px; text-align: center; }
        .contact-item div { flex: 1; }
        .contact-item .label { font-size: 11px; color: var(--text-muted); display: block; }
        .contact-item .value { font-weight: 700; font-size: 15px; }
        .contact-actions { display: flex; gap: 8px; }
        .contact-actions a { width: 36px; height: 36px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; font-size: 14px; transition: 0.2s; }
        .contact-actions a:hover { background: var(--primary-hover); }

        /* Upload Modal Specific (Pyramid Layout) */
        .upload-options { display: flex; flex-direction: column; gap: 12px; margin-top: 25px; }
        .upload-row { display: flex; justify-content: center; gap: 12px; }
        .upload-opt { width: 90px; padding: 15px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 16px; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); backdrop-filter: blur(10px); }
        .upload-opt:hover { transform: translateY(-5px) scale(1.05); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .upload-opt i { font-size: 32px; transition: transform 0.3s; }
        .upload-opt:hover i { transform: scale(1.1); }
        .upload-opt span { font-size: 12px; font-weight: 700; color: var(--text-main); }
        
        /* Icon Colors */
        .c-telegram { color: #0088cc; text-shadow: 0 0 10px rgba(0,136,204,0.5); }
        .c-eitaa { color: #ff9800; text-shadow: 0 0 10px rgba(255,152,0,0.5); }
        .c-rubika { color: #a855f7; text-shadow: 0 0 10px rgba(168,85,247,0.5); }
        .c-bale { color: #0ea5e9; text-shadow: 0 0 10px rgba(14,165,233,0.5); }
        .c-shad { color: #22c55e; text-shadow: 0 0 10px rgba(34,197,94,0.5); }

        /* Mobile Search Overrides */
        @media (max-width: 767px) {
            .search-box-mini {
                width: auto; /* override desktop width */
                flex: 1;
            }
            .search-box-mini.expanded {
                position: absolute;
                top: -5px; left: 0; right: 0;
                width: 100%;
                padding: 5px;
                background: var(--surface);
                border-radius: 20px;
                box-shadow: 0 5px 20px rgba(0,0,0,0.5);
                z-index: 105;
            }
            .search-box-mini.expanded input { font-size: 14px; padding: 10px 15px 10px 40px; background: var(--bg);}
            .search-box-mini.expanded i { left: 15px; font-size: 16px; }
        }

        @media (min-width: 768px) {
            body { padding-bottom: 0; }
            .nav-links { display: flex; }
            .bottom-nav { display: none; }
            .header-actions { flex: 0; }
            .hero { padding: 40px 20px 60px; }
            .monitor { width: 85%; }
            .keyboard {
